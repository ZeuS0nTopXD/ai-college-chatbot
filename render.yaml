services:
  - type: web
    name: vsit-student-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/vsit_student_assistant.db
      - key: DOCUMENT_STORAGE_PATH
        value: /app/data/documents
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TOKEN_TTL_MINUTES
        value: "60"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: OLLAMA_URL
        value: http://127.0.0.1:11434/api/generate
      - key: OLLAMA_MODEL
        value: llama3.2:3b
