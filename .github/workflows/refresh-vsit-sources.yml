name: Refresh VSIT sources

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh public VSIT source index
        env:
          APP_URL: ${{ secrets.VSIT_APP_URL }}
          ADMIN_TOKEN: ${{ secrets.VSIT_ADMIN_TOKEN }}
        run: |
          test -n "$APP_URL"
          test -n "$ADMIN_TOKEN"
          curl --fail-with-body --retry 3 --request POST \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            "$APP_URL/api/admin/refresh-sources"
